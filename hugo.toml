baseURL = "https://seoimpuls.com/"
languageCode = "en-us"
title = "SeoImpuls"
cleanDestinationDir = true
ignoreFiles = ['^lib/.*']
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[outputs]
  home = ["HTML", "RSS", "JSON", "NewsFeed"]

[outputFormats.NewsFeed]
  mediaType = "application/json"
  baseName = "news-feed"
  isPlainText = true
  notAlternative = true

[minify]
  minifyOutput = true

[module]
  [[module.imports]]
    path = "github.com/dillonzq/LoveIt"

[params]
  title = "SeoImpuls"
  description = "Technical SEO, search intent and content strategy for sustainable organic visibility."
  images = ["/SEOIMPULS_logo.webp"]

  [params.author]
    name = "SeoImpuls Team"

  [params.app]
    title = "SeoImpuls"
    themeColor = "#061126"
    iconColor = "#5bbad5"
    tileColor = "#061126"

  [params.seo]
    image = "/SEOIMPULS_logo.webp"
    thumbnailUrl = "/SEOIMPULS_logo.webp"
    noindex = false

  [params.verification]
    google = ""
    bing = ""
    yandex = ""
    pinterest = ""
    baidu = ""

  [params.analytics]
    enable = false

    [params.analytics.google]
      id = ""
      anonymizeIP = true

  [params.page.seo]
    images = ["/SEOIMPULS_logo.webp"]

    [params.page.seo.publisher]
      name = "SeoImpuls"
      logoUrl = "/SEOIMPULS_logo.webp"

[params.page.code]
  copy = false

[params.page.share]
  enable = false

[languages]





























































  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    weight = 1

    [languages.en.params.home]
      rss = 10

      [languages.en.params.home.profile]
        enable = true
        title = "SEO Strategy and Technical SEO Insights"
        subtitle = ""
        social = false

      [languages.en.params.home.posts]
        enable = false

