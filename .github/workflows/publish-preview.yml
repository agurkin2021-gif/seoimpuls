name: Publish SEOImpuls working preview

on:
  push:
    branches: [white-seo-rebuild]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: seoimpuls-working-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.5'
          extended: true
      - name: Build preview
        run: hugo --minify --noBuildLock --baseURL 'https://agurkin2021-gif.github.io/seoimpuls/'
      - name: Verify EN homepage schema and preserve RU/ES
        run: python3 scripts/verify_en_home_schema.py
      - name: Verify EN SEO hub canonical and redirects
        run: python3 scripts/verify_en_services_route.py
      - name: Verify English homepage floating footer
        run: python3 scripts/verify_en_footer_popup.py
      - name: Require white-hat and retired URL checks
        run: |
          python3 scripts/verify_retired_routes.py --site public --routes docs/retired-routes-en.txt
          python3 scripts/whitehat_content_gate.py --site public --strict
      - name: Make preview paths work under GitHub Pages subdirectory and prevent indexing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('public')
          for f in root.rglob('*.html'):
              s=f.read_text(encoding='utf-8')
              s=re.sub(r'''(?i)(\s(?:href|src|action|poster|content|srcset)\s*=\s*["']?/)(?!/|seoimpuls/)''',r'\1seoimpuls/',s)
              # Use one consistent robots directive in preview; remove conflicting production index meta first.
              s=re.sub(r'''(?is)<meta\b(?=[^>]*\bname\s*=\s*["']?robots\b)[^>]*>''','',s)
              s=re.sub(r'(?i)(<head\b[^>]*>)',r'\1<meta name="robots" content="noindex,nofollow">',s,count=1)
              f.write_text(s,encoding='utf-8')
          for f in root.rglob('*.css'):
              s=f.read_text(encoding='utf-8')
              s=re.sub(r'url\((["\x27]?)/(?!/|seoimpuls/)',r'url(\1/seoimpuls/',s)
              f.write_text(s,encoding='utf-8')
          assert (root/'index.html').exists()
          for htmlfile in (root/'index.html',root/'technical-seo-audit'/'index.html',root/'keyword-research'/'index.html',root/'seo-consultation'/'index.html',root/'ru'/'uslugi'/'index.html',root/'es'/'servicios'/'index.html'):
              txt=htmlfile.read_text(encoding='utf-8')
              matches=re.findall(r'''(?is)<meta\b(?=[^>]*\bname\s*=\s*["']?robots\b)[^>]*>''',txt)
              assert len(matches)==1 and 'noindex,nofollow' in matches[0].lower(),(htmlfile,matches)
          print('PASS: preview EN/RU/ES have exactly one noindex robots tag without index conflict')

          from html.parser import HTMLParser
          class AnchorLinks(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':
                      self.urls.append(dict(attrs).get('href',''))
          links=AnchorLinks()
          links.feed((root/'index.html').read_text(encoding='utf-8'))
          for expected in ('/seoimpuls/#services','/seoimpuls/technical-seo-audit/',
                           '/seoimpuls/keyword-research/','/seoimpuls/seo-consultation/',
                           '/seoimpuls/#contact-project'):
              assert expected in links.urls, 'Missing preview path '+expected
          invalid=[url for url in links.urls
                   if url.startswith('/') and not url.startswith('//')
                   and not url.startswith('/seoimpuls/')]
          assert not invalid, 'EN home links escaped preview base path: '+str(invalid[:12])
          for retired in ('/seoimpuls/seo-services/','/seoimpuls/seo/','/seoimpuls/services/keyword-research/','/seoimpuls/services/seo-consultation/'):
              assert retired not in links.urls, 'Retired EN internal link in homepage: '+retired
          print('PASS: EN home detail routes, services and contact anchors resolve under /seoimpuls/')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
