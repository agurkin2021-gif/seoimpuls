      - name: Verify ES white SEO catalog and reciprocal hreflang
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self):
                  super().__init__();self.h=[];self.h1=False;self.canon=[];self.alts={};self.links=[];self.cards=[]
              def handle_starttag(self,t,attrs):
                  a=dict(attrs)
                  if t=='h1':self.h1=True
                  if t=='a':
                      self.links.append(a.get('href',''))
                      if 'services-hub-card' in a.get('class',''):self.cards.append(a.get('href',''))
                  if t=='link' and a.get('rel')=='canonical':self.canon.append(a.get('href',''))
                  if t=='link' and a.get('rel')=='alternate':self.alts[a.get('hreflang')]=a.get('href','')
              def handle_endtag(self,t):
                  if t=='h1':self.h1=False
              def handle_data(self,s):
                  if self.h1:self.h.append(s)
          items=[
            ('services/', 'ru/uslugi/', 'es/servicios/'),
            ('services/keyword-research/','ru/uslugi/semanticheskoe-yadro/','es/servicios/investigacion-palabras-clave/'),
            ('services/seo-consultation/','ru/uslugi/seo-konsultaciya/','es/servicios/consultoria-seo/')]
          for triple in items:
              expect={'en-us':'https://seoimpuls.com/'+triple[0],
                      'ru-ru':'https://seoimpuls.com/'+triple[1],
                      'es-es':'https://seoimpuls.com/'+triple[2]}
