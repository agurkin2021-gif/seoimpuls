      - name: Inventory rendered affiliate placements (diagnostic, no deployment)
        run: python3 scripts/audit_affiliate_links.py --site public --max-details 150
      - name: Report whole-site white-hat release blockers (diagnostic, never deploy)
        run: python3 scripts/whitehat_content_gate.py --site public --max-details 40
      # The gate becomes strict during final release qualification:
      # python3 scripts/whitehat_content_gate.py --site public --strict
      - name: Verify generated pages and EN homepage white-hat copy
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ignore=0;self.visible=[];self.h1=[];self.onh1=False;self.links=[];self.canonical=[];self.ids=[]
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if attrs.get('id'):self.ids.append(attrs['id'])
                  if tag in ('script','style'):self.ignore+=1
                  if tag=='h1':self.onh1=True
                  if tag=='a':self.links.append(attrs.get('href',''))
                  if tag=='link' and attrs.get('rel')=='canonical':self.canonical.append(attrs.get('href',''))
              def handle_endtag(self,tag):
                  if tag in ('script','style'):self.ignore=max(0,self.ignore-1)
                  if tag=='h1':self.onh1=False
              def handle_data(self,data):
                  if not self.ignore:
                      self.visible.append(data)
                      if self.onh1:self.h1.append(data)
          for path in ['public/index.html','public/ru/index.html','public/es/index.html','public/sitemap.xml']:
              assert Path(path).is_file() and Path(path).stat().st_size>0,path
          page=Page()
          html=Path('public/index.html').read_text(encoding='utf-8')
          page.feed(html)
          visible=' '.join(' '.join(page.visible).split()).lower()
          forbidden=['link building services','backlink strategies','domain rating increase','tier 1-2-3',
                     'xrumer','gsa ser','xevil','vps hosting','controlled authority growth','sample article body for visual testing']
          legacy=[x for x in forbidden if x in visible]
          if legacy:raise SystemExit('Legacy grey copy on EN homepage: '+str(legacy))
          if ''.join(page.h1).strip()!='SEO Services for Sustainable Organic Growth':
              raise SystemExit('Incorrect EN homepage H1: '+str(page.h1))
          if '/seo/' not in page.links:raise SystemExit('SEO service CTA missing')
          if '/go/vdsina/' in page.links:raise SystemExit('Unrelated hosting affiliate remains')
          if 'how-it-works' not in page.ids:raise SystemExit('SEO process anchor missing: '+str(page.ids[:40]))
          if page.canonical!=['https://seoimpuls.com/']:raise SystemExit('Unexpected canonical: '+str(page.canonical))
          service=Page()
          service_html=Path('public/seo/index.html').read_text(encoding='utf-8')
          service.feed(service_html)
          if ''.join(service.h1).strip()!='Technical SEO Services & Audits':
              raise SystemExit('Incorrect /seo/ H1: '+str(service.h1))
          service_txt=' '.join(' '.join(service.visible).split()).lower()
          for fragment in ('llink building services','backlink strategies','domain rating increase','tier 1-2-3','xrumer','xevil'):
              if fragment in service_txt:raise SystemExit('Legacy term on EN /seo/: '+fragment)
          if '/link-building-services/' in service.links:
              raise SystemExit('EN /seo/ still links to legacy backlink service hub')
          for fragment in ('technical-seo','on-page-seo','content-strategy','international-seo','seo-process','contact-seo'):
              if fragment not in service.ids:raise SystemExit('Missing /seo/ anchor: '+fragment)
          print('PASS: EN /seo/ H1, content, anchors, no legacy service link.')
          kw=Page()
          kw_html=Path('public/services/keyword-research/index.html').read_text(encoding='utf-8')
          kw.feed(kw_html)
          if ''.join(kw.h1).strip()!='Keyword Research & Search Intent Mapping':
              raise SystemExit('Incorrect keyword research H1: '+str(kw.h1))
          if kw.canonical!=['https://seoimpuls.com/services/keyword-research/']:
              raise SystemExit('Unexpected keyword research canonical: '+str(kw.canonical))
          for fragment in ('what-is-included','formats','methodology','deliverables','pricing','faq','contact'):
              if fragment not in kw.ids:raise SystemExit('Missing keyword research section: '+fragment)
          kw_txt=' '.join(' '.join(kw.visible).split()).lower()
          for forbidden in ('tier 1-2-3','link building services','mass backlinks','domain rating increase','xrumer'):
              if forbidden in kw_txt:raise SystemExit('Legacy keyword research term: '+forbidden)
          print('PASS: EN keyword research new URL, H1, canonical, sections and clean copy.')
          hub=Page()
