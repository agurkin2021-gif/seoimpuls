name: Validate SEOImpuls rebuild (no deployment)

on:
  push:
    branches: [white-seo-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.5'
          extended: true
      - name: Build all languages
        run: hugo --minify --noBuildLock
      - name: Report whole-site white-hat release blockers (diagnostic, never deploy)
        run: python3 scripts/whitehat_content_gate.py --site public --max-details 40
      # The gate becomes strict during final release qualification:
      # python3 scripts/whitehat_content_gate.py --site public --strict
      - name: Verify generated pages and EN homepage white-hat copy
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ignore=0;self.visible=[];self.h1=[];self.onh1=False;self.links=[];self.canonical=[];self.ids=[]
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if attrs.get('id'):self.ids.append(attrs['id'])
                  if tag in ('script','style'):self.ignore+=1
                  if tag=='h1':self.onh1=True
                  if tag=='a':self.links.append(attrs.get('href',''))
                  if tag=='link' and attrs.get('rel')=='canonical':self.canonical.append(attrs.get('href',''))
              def handle_endtag(self,tag):
                  if tag in ('script','style'):self.ignore=max(0,self.ignore-1)
                  if tag=='h1':self.onh1=False
              def handle_data(self,data):
                  if not self.ignore:
                      self.visible.append(data)
                      if self.onh1:self.h1.append(data)
          for path in ['public/index.html','public/ru/index.html','public/es/index.html','public/sitemap.xml']:
              assert Path(path).is_file() and Path(path).stat().st_size>0,path
          page=Page()
          html=Path('public/index.html').read_text(encoding='utf-8')
          page.feed(html)
          visible=' '.join(' '.join(page.visible).split()).lower()
          forbidden=['link building services','backlink strategies','domain rating increase','tier 1-2-3',
                     'xrumer','gsa ser','xevil','vps hosting','controlled authority growth','sample article body for visual testing']
          legacy=[x for x in forbidden if x in visible]
          if legacy:raise SystemExit('Legacy grey copy on EN homepage: '+str(legacy))
          if ''.join(page.h1).strip()!='SEO Services for Sustainable Organic Growth':
              raise SystemExit('Incorrect EN homepage H1: '+str(page.h1))
          if '/seo/' not in page.links:raise SystemExit('SEO service CTA missing')
          if '/go/vdsina/' in page.links:raise SystemExit('Unrelated hosting affiliate remains')
          if 'how-it-works' not in page.ids:raise SystemExit('SEO process anchor missing: '+str(page.ids[:40]))
          if page.canonical!=['https://seoimpuls.com/']:raise SystemExit('Unexpected canonical: '+str(page.canonical))
          service=Page()
          service_html=Path('public/seo/index.html').read_text(encoding='utf-8')
          service.feed(service_html)
          if ''.join(service.h1).strip()!='Technical SEO Services & Audits':
              raise SystemExit('Incorrect /seo/ H1: '+str(service.h1))
          service_txt=' '.join(' '.join(service.visible).split()).lower()
          for fragment in ('llink building services','backlink strategies','domain rating increase','tier 1-2-3','xrumer','xevil'):
              if fragment in service_txt:raise SystemExit('Legacy term on EN /seo/: '+fragment)
          if '/link-building-services/' in service.links:
              raise SystemExit('EN /seo/ still links to legacy backlink service hub')
          for fragment in ('technical-seo','on-page-seo','content-strategy','international-seo','seo-process','contact-seo'):
              if fragment not in service.ids:raise SystemExit('Missing /seo/ anchor: '+fragment)
          print('PASS: EN /seo/ H1, content, anchors, no legacy service link.')
          kw=Page()
          kw_html=Path('public/services/keyword-research/index.html').read_text(encoding='utf-8')
          kw.feed(kw_html)
          if ''.join(kw.h1).strip()!='Keyword Research & Search Intent Mapping':
              raise SystemExit('Incorrect keyword research H1: '+str(kw.h1))
          if kw.canonical!=['https://seoimpuls.com/services/keyword-research/']:
              raise SystemExit('Unexpected keyword research canonical: '+str(kw.canonical))
          for fragment in ('what-is-included','formats','methodology','deliverables','pricing','faq','contact'):
              if fragment not in kw.ids:raise SystemExit('Missing keyword research section: '+fragment)
          kw_txt=' '.join(' '.join(kw.visible).split()).lower()
          for forbidden in ('tier 1-2-3','link building services','mass backlinks','domain rating increase','xrumer'):
              if forbidden in kw_txt:raise SystemExit('Legacy keyword research term: '+forbidden)
          print('PASS: EN keyword research new URL, H1, canonical, sections and clean copy.')
          hub=Page()
          hub.feed(Path('public/services/index.html').read_text(encoding='utf-8'))
          if ''.join(hub.h1).strip()!='SEO Services & Practical Deliverables':
              raise SystemExit('Unexpected /services/ H1: '+str(hub.h1))
          if hub.canonical!=['https://seoimpuls.com/services/']:
              raise SystemExit('Unexpected /services/ canonical: '+str(hub.canonical))
          hub_text=' '.join(' '.join(hub.visible).split()).lower()
          for old in ('link building services','domain rating','mass backlinks','tier 1-2-3','microsite development'):
              if old in hub_text:raise SystemExit('Old service catalog term visible: '+old)
          if '/seo/' not in hub.links or '/services/keyword-research/' not in hub.links:
              raise SystemExit('Missing current SEO services in catalog')
          if 'link building services' in kw_txt:
              raise SystemExit('Outdated breadcrumb remains on keyword research page')
          print('PASS: /services/ catalog, canonical, H1, valid service links, keyword breadcrumb.')
          consult=Page()
          consult.feed(Path('public/services/seo-consultation/index.html').read_text(encoding='utf-8'))
          if ''.join(consult.h1).strip()!='SEO Consultation & Strategy Review':
              raise SystemExit('Unexpected consultation H1: '+str(consult.h1))
          if consult.canonical!=['https://seoimpuls.com/services/seo-consultation/']:
              raise SystemExit('Incorrect consultation canonical: '+str(consult.canonical))
          for section in ('who-it-is-for','topics','prepare','format','results','faq','contact'):
              if section not in consult.ids:raise SystemExit('Missing consultation anchor: '+section)
          consult_text=' '.join(' '.join(consult.visible).split()).lower()
          for forbidden in ('link building services','indefinite ongoing support','unlimited long-term support',
                            'guaranteed google rankings','xrumer','tier 1-2-3','domain rating increase'):
              if forbidden in consult_text:raise SystemExit('Old consultation term: '+forbidden)
          if '/services/seo-consultation/' not in hub.links:
              raise SystemExit('SEO consultation is missing from clean services catalog')
          print('PASS: /services/seo-consultation/ H1/canonical, content, anchors and catalog link.')
          about=Page()
          about.feed(Path('public/about/index.html').read_text(encoding='utf-8'))
          if ''.join(about.h1).strip()!='About SEOImpuls':
              raise SystemExit('Incorrect About H1: '+str(about.h1))
          if about.canonical!=['https://seoimpuls.com/about/']:
              raise SystemExit('Unexpected About canonical: '+str(about.canonical))
          about_txt=' '.join(' '.join(about.visible).split()).lower()
          for legacy in ('link building services','years of practical experience in seo, link building',
                         '2,900+','1,690+','100% of orders delivered successfully','pbn','tier 1-2-3'):
              if legacy in about_txt:raise SystemExit('Unverified/legacy claims on About: '+legacy)
          if '/services/' not in about.links or '/seo/' not in about.links:
              raise SystemExit('Missing approved service links on About')
          for anchor in ('approach','services','accountability','trust','contact'):
              if anchor not in about.ids:raise SystemExit('Missing About section: '+anchor)
          print('PASS: About SEOImpuls contains transparent approach, service links, no legacy statistics.')
          faq=Page()
          faq.feed(Path('public/faq/index.html').read_text(encoding='utf-8'))
          if ''.join(faq.h1).strip()!='SEO Services FAQ':
              raise SystemExit('Unexpected FAQ H1: '+str(faq.h1))
          if faq.canonical!=['https://seoimpuls.com/faq/']:
              raise SystemExit('Unexpected FAQ canonical: '+str(faq.canonical))
          faq_txt=' '.join(' '.join(faq.visible).split()).lower()
          for essential in ('keyword research differ','how quickly','multilingual websites','google search console','how is progress measured'):
              if essential not in faq_txt:raise SystemExit('Missing FAQ coverage: '+essential)
          for forbidden in ('link building services','domain rating increase','xrumer','gsa ser','rankings in a guaranteed timeframe'):
              if forbidden in faq_txt:raise SystemExit('Legacy or unsupported FAQ claim: '+forbidden)
          for service_url in ('/seo/','/services/','/services/keyword-research/','/services/seo-consultation/'):
              if service_url not in faq.links:raise SystemExit('Missing FAQ service link: '+service_url)
          print('PASS: EN FAQ H1, canonical, helpful answers and internal service links.')
          class PrimaryNav(HTMLParser):
              def __init__(self):
                  super().__init__();self.active=False;self.hrefs=[]
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if tag=='nav' and 'custom-header__nav' in attrs.get('class',''):self.active=True
                  if self.active and tag=='a':self.hrefs.append(attrs.get('href',''))
              def handle_endtag(self,tag):
                  if tag=='nav' and self.active:self.active=False
          for lang in ('ru','es'):
              menu=PrimaryNav()
              menu.feed(Path('public/'+lang+'/index.html').read_text(encoding='utf-8'))
              if '/'+lang+'/seo/' not in menu.hrefs:
                  raise SystemExit('Missing localized SEO menu link for '+lang+': '+str(menu.hrefs))
              if any(('link-building' in u or 'uslugi-linkbildinga' in u or '/soft/' in u) for u in menu.hrefs):
                  raise SystemExit('Legacy or broken menu link for '+lang+': '+str(menu.hrefs))
          print('PASS: RU/ES menus use localized SEO path with no gray legacy category.')







          print('PASS: Hugo outputs EN, RU, ES, sitemap; clean EN homepage H1/links/content/canonical.')
          PY
