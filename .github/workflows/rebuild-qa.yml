name: Validate SEOImpuls rebuild (no deployment)

on:
  push:
    branches: [white-seo-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.5'
          extended: true
      - name: Build all languages
        run: hugo --minify --noBuildLock
      - name: Verify EN homepage schema and preserve RU/ES
        run: python3 scripts/verify_en_home_schema.py
      - name: Verify EN SEO hub canonical and redirects
        run: python3 scripts/verify_en_services_route.py
      - name: Verify English homepage floating footer
        run: python3 scripts/verify_en_footer_popup.py
      - name: Prevent unrelated affiliate link substitution
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          attrs = Path('layouts/partials/affiliate-link-attrs.html').read_text(encoding='utf-8')
          cloak = Path('layouts/partials/affiliate-link-cloak.html').read_text(encoding='utf-8')
          static = Path('static/go/vdsina/index.html').read_text(encoding='utf-8')
          alias_line = next((line for line in attrs.splitlines() if '$isVdsinaAlias :=' in line), '')
          assert alias_line, 'Explicit referral alias rule is missing'
          assert '/go/vdsina/' in alias_line, 'The permitted explicit referral route changed'
          for path in ('/soft/', '/ru/soft/', '/es/soft/'):
              assert path not in alias_line, f'Hidden affiliate alias remains: {path}'
              assert ('<a href="' + path + '">') not in cloak, f'Hidden affiliate rewrite remains: {path}'
          assert 'nofollow sponsored' in attrs and 'nofollow sponsored' in cloak, 'Affiliate link rel missing'
          assert 'noindex' in static.lower(), 'Affiliate redirect missing noindex'
          assert 'https://www.vdsina.com/?partner=' in static, 'Affiliate destination changed'
          print('PASS: explicit affiliate redirect preserved; no /soft/ affiliate substitutions.')
          PY
      - name: Enforce no published links or output for retired URLs
        run: python3 scripts/verify_retired_routes.py --site public --routes docs/retired-routes-en.txt
      - name: Verify RU homepage affiliate labels and grounded hosting copy
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class TextCollector(HTMLParser):
              def __init__(self):
                  super().__init__(); self.out=[]
              def handle_data(self, data): self.out.append(data)
          html = Path('public/ru/index.html').read_text(encoding='utf-8')
          collector = TextCollector(); collector.feed(html)
          text = ' '.join(' '.join(collector.out).split()).casefold()
          assert 'vps для размещения сайта' in text, 'RU VPS card missing'
          assert text.count('партнёрская ссылка') >= 2, 'RU VPS card or offer disclosure missing'
          assert 'хостинг приватных сетей' not in text, 'Gray private-network promise remains'
          assert 'vps не гарантирует улучшения индексации' in text, 'Required VPS limitation missing'
          print('PASS: RU homepage VPS CTA is contextual, disclosed and avoids ranking promises.')
          PY
      - name: Verify ES homepage affiliate disclosure and hosting claims
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class TextCollector(HTMLParser):
              def __init__(self):
                  super().__init__(); self.out=[]
              def handle_data(self, data): self.out.append(data)
          html = Path('public/es/index.html').read_text(encoding='utf-8')
          collector = TextCollector(); collector.feed(html)
          text = ' '.join(' '.join(collector.out).split()).casefold()
          assert 'vps para alojar tu sitio' in text, 'ES VPS card missing'
          assert text.count('enlace de afiliado') >= 2, 'ES card or offer disclosure missing'
          assert 'hosting de red privada' not in text, 'Misleading private network hosting still shown'
          assert 'no garantiza una mejor indexación' in text, 'VPS ranking limitation missing'
          print('PASS: ES homepage VPS CTA is contextual, disclosed and makes no ranking guarantees.')
          PY
      - name: Validate RU strategy-builder retirement and homepage CTA destinations
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          targets = {'heroBuilderUrl': ('/ru/uslugi/', 'SEO-услуги'),
                     'heroCasesUrl': ('/ru/about/', 'О компании')}
          class HeroLinks(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = None
                  self.links = {}
              def handle_starttag(self, tag, attrs):
                  if tag != 'a': return
                  data = dict(attrs)
                  field = data.get('data-home-link-field')
                  if field in targets:
                      self.current = (field, data.get('href', ''), [])
              def handle_data(self, value):
                  if self.current:
                      self.current[2].append(value)
              def handle_endtag(self, tag):
                  if tag == 'a' and self.current:
                      field, href, words = self.current
                      self.links[field] = (href, ' '.join(' '.join(words).split()))
                      self.current = None
          html = Path('public/ru/index.html').read_text(encoding='utf-8')
          parsed = HeroLinks()
          parsed.feed(html)
          for field, expected in targets.items():
              actual = parsed.links.get(field)
              assert actual == expected, f'{field}: expected {expected}, got {actual}'
          assert not Path('public/ru/konstruktor-seo-strategii/index.html').exists(), 'Retired RU builder still published'
          assert Path('public/ru/seo/index.html').is_file(), 'RU SEO destination missing'
          assert Path('public/ru/about/index.html').is_file(), 'RU About destination missing'
          print('PASS: RU strategy builder withdrawn; hero CTAs use real, correctly labelled destinations.')
          PY
      - name: Validate ES strategy-builder retirement and homepage CTA destinations
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          targets = {'heroBuilderUrl': ('/es/servicios/', 'Servicios SEO'),
                     'heroCasesUrl': ('/es/about/', 'Sobre nosotros')}
          class HeroLinks(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = None
                  self.links = {}
              def handle_starttag(self, tag, attrs):
                  if tag != 'a': return
                  data = dict(attrs)
                  field = data.get('data-home-link-field')
                  if field in targets: self.current = (field, data.get('href', ''), [])
              def handle_data(self, value):
                  if self.current: self.current[2].append(value)
              def handle_endtag(self, tag):
                  if tag == 'a' and self.current:
                      field, href, words = self.current
                      self.links[field] = (href, ' '.join(' '.join(words).split()))
                      self.current = None
          html = Path('public/es/index.html').read_text(encoding='utf-8')
          parsed = HeroLinks()
          parsed.feed(html)
          for field, expected in targets.items():
              actual = parsed.links.get(field)
              assert actual == expected, f'{field}: expected {expected}, got {actual}'
          assert not Path('public/es/constructor-estrategias-seo/index.html').exists(), 'ES builder is still rendered'
          assert Path('public/es/seo/index.html').is_file(), 'ES SEO target missing'
          assert Path('public/es/about/index.html').is_file(), 'ES About target missing'
          print('PASS: ES builder retired; primary and secondary homepage CTA destinations and labels are correct.')
          PY
      - name: Verify localized RU keyword migration
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.h1=[];self.onh1=False;self.canonicals=[];self.links=[];self.hreflang={}
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='h1':self.onh1=True
                  if tag=='a':self.links.append(a.get('href',''))
                  if tag=='link' and a.get('rel')=='canonical':self.canonicals.append(a.get('href',''))
                  if tag=='link' and a.get('rel')=='alternate' and a.get('hreflang'):self.hreflang[a['hreflang']]=a.get('href','')
              def handle_endtag(self,tag):
                  if tag=='h1':self.onh1=False
              def handle_data(self,text):
                  if self.onh1:self.h1.append(text)
          page=Path('public/ru/uslugi/semanticheskoe-yadro/index.html')
          assert page.is_file(), 'RU keyword canonical target not built'
          x=Page(); x.feed(page.read_text(encoding='utf-8'))
          assert ''.join(x.h1).strip()=='Сбор семантического ядра и кластеризация запросов',x.h1
          assert x.canonicals==['https://seoimpuls.com/ru/uslugi/semanticheskoe-yadro/'],x.canonicals
          assert x.hreflang.get('en-us')=='https://seoimpuls.com/keyword-research/',x.hreflang
          assert '/ru/seo/' in x.links,'RU technical SEO related link missing'
          assert not Path('public/uslugi-linkbildinga/sbor-semanticheskogo-yadra/index.html').exists()
          assert not Path('public/ru/uslugi-linkbildinga/sbor-semanticheskogo-yadra/index.html').exists()
          print('PASS: RU keyword research H1, canonical, EN alternate, internal link and retired old URL')
          PY
      - name: Verify localized RU SEO consultation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Head(HTMLParser):
              def __init__(self):
                  super().__init__();self.h1=[];self.inside=False;self.canonical=[];self.alt={};self.links=[]
              def handle_starttag(self,t,attrs):
                  a=dict(attrs)
                  if t=='h1': self.inside=True
                  if t=='a':self.links.append(a.get('href',''))
                  if t=='link' and a.get('rel')=='canonical':self.canonical.append(a.get('href',''))
                  if t=='link' and a.get('rel')=='alternate':self.alt[a.get('hreflang')]=a.get('href','')
              def handle_endtag(self,t):
                  if t=='h1':self.inside=False
              def handle_data(self,s):
                  if self.inside:self.h1.append(s)
          p=Path('public/ru/uslugi/seo-konsultaciya/index.html')
          assert p.is_file(),'RU consultation not generated'
          x=Head();x.feed(p.read_text(encoding='utf-8'))
          assert ''.join(x.h1).strip()=='SEO-консультация по сайту и стратегии',x.h1
          assert x.canonical==['https://seoimpuls.com/ru/uslugi/seo-konsultaciya/'],x.canonical
          assert x.alt.get('en-us')=='https://seoimpuls.com/seo-consultation/',x.alt
          assert '/ru/uslugi/semanticheskoe-yadro/' in x.links,'RU keyword link missing'
          assert not Path('public/uslugi-linkbildinga/seo-konsultaciya/index.html').exists()
          assert not Path('public/ru/uslugi-linkbildinga/seo-konsultaciya/index.html').exists()
          print('PASS: RU consultation new canonical, H1, EN hreflang, internal links, old URL gone')
          PY
      - name: Validate RU white SEO services hub and navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.h1=[]; self.in_h1=False; self.canon=[]; self.lang={}; self.links=[]; self.cards=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='h1': self.in_h1=True
                  if tag=='a':
                      self.links.append(a.get('href',''))
                      if 'services-hub-card' in a.get('class',''): self.cards.append(a.get('href',''))
                  if tag=='link' and a.get('rel')=='canonical':self.canon.append(a.get('href',''))
                  if tag=='link' and a.get('rel')=='alternate':self.lang[a.get('hreflang')]=a.get('href','')
              def handle_endtag(self,tag):
                  if tag=='h1':self.in_h1=False
              def handle_data(self,val):
                  if self.in_h1:self.h1.append(val)
          hub=Path('public/ru/uslugi/index.html')
          assert hub.is_file(), 'RU services catalog missing'
          h=Page();h.feed(hub.read_text(encoding='utf-8'))
          assert ''.join(h.h1).strip()=='SEO-услуги для сайта',h.h1
          assert h.canon==['https://seoimpuls.com/ru/uslugi/'],h.canon
          assert not h.lang.get('en-us'),('EN hub retired; no invented equivalent',h.lang)
          valid={'/ru/seo/','/ru/uslugi/semanticheskoe-yadro/','/ru/uslugi/seo-konsultaciya/','/ru/uslugi/razrabotka-saitov/'}
          assert len(h.cards)==4 and set(h.cards)==valid,h.cards
          for path in valid:
              assert Path('public/'+path.lstrip('/')+'index.html').is_file(),path
          home=Page();home.feed(Path('public/ru/index.html').read_text(encoding='utf-8'))
          assert '/ru/uslugi/' in home.links,'RU homepage missing catalog link'
          assert '/ru/seo/' in home.links,'RU homepage missing technical SEO link'
          assert not Path('public/uslugi-linkbildinga/index.html').exists(),'Old gray hub generated'
          print('PASS: RU catalog canonical, EN hreflang, 4 live cards, homepage/menu targets')
          PY
