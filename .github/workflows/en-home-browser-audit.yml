name: English homepage visual browser audit
on:
  push:
    branches: [white-seo-rebuild]
    paths:
      - 'scripts/audit_en_home_browser.cjs'
      - '.github/workflows/en-home-browser-audit.yml'
      - 'content/_index.md'
      - 'layouts/index.html'
      - 'layouts/partials/head/seo.html'
      - 'layouts/partials/header.html'
      - 'layouts/partials/footer.html'
      - 'assets/css/_home_inline.scss'
      - 'assets/css/_override.scss'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.5'
          extended: true
      - name: Build production-base HTML
        run: hugo --minify --noBuildLock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright browser
        run: |
          npm install --no-save --prefix /tmp/seo-home-qa playwright@1.56.1
          node /tmp/seo-home-qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Start local HTML server
        run: |
          nohup python3 -m http.server 8765 --directory public >/tmp/seo-home-server.log 2>&1 &
          sleep 2
          curl -fsSI http://127.0.0.1:8765/
      - name: Capture responsive screenshots and browser diagnostics
        env:
          NODE_PATH: /tmp/seo-home-qa/node_modules
        run: node scripts/audit_en_home_browser.cjs
      - name: Save screenshot and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seoimpuls-en-home-390-1280
          path: audit-artifacts/en-home/
          if-no-files-found: warn
          retention-days: 14
