<script>
  (function () {
    if (window.__seoAffiliateCloakReady) return;
    window.__seoAffiliateCloakReady = true;

    function getTarget(link) {
      var target = (link && link.getAttribute("data-seo-cloaked-href") || "").trim();
      if (!/^https:\/\/(?:www\.)?vdsina\.com\/\?partner=[A-Za-z0-9_-]+$/i.test(target)) {
        return "";
      }
      return target;
    }

    function openTarget(event) {
      var link = event.target && event.target.closest ? event.target.closest("a[data-seo-cloaked-href]") : null;
      if (!link) return;
      var target = getTarget(link);
      if (!target) return;
      event.preventDefault();

      if (event.type === "auxclick" || event.button === 1 || event.metaKey || event.ctrlKey || event.shiftKey || link.target === "_blank") {
        window.open(target, "_blank", "noopener");
        return;
      }
      window.location.href = target;
    }

    document.addEventListener("click", openTarget, true);
    document.addEventListener("auxclick", openTarget, true);
  })();
</script>
