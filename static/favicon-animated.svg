<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Animated chain favicon">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#082f80"/>
      <stop offset="58%" stop-color="#04245f"/>
      <stop offset="100%" stop-color="#011336"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#0ab8ff" flood-opacity="0.45"/>
    </filter>
    <clipPath id="clipCircle">
      <circle cx="32" cy="32" r="29.5"/>
    </clipPath>
  </defs>

  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>

  <g clip-path="url(#clipCircle)">
    <g filter="url(#shadow)">
      <g>
        <animateTransform
          attributeName="transform"
          attributeType="XML"
          type="rotate"
          from="0 32 32"
          to="360 32 32"
          dur="3s"
          repeatCount="indefinite" />
        <image href="data:image/png;base64," x="-1.7" y="3.7" width="64" height="64"/>
      </g>
    </g>
  </g>

  <circle cx="32" cy="32" r="31" fill="none" stroke="#45b9ff" stroke-opacity="0.35" stroke-width="1"/>
</svg>
